name: WikiREA senior reviews
on:
  schedule:
    - cron: '23 1,3,5,7,9,13,15,17,19,21 * * *'
  workflow_dispatch:
    inputs:
      batch:
        description: 'Compiled packets to reserve (shared review cap applies)'
        type: choice
        options: ['1', '2', '10']
        default: '1'
permissions:
  contents: write
  actions: write
concurrency:
  group: wikirea-research
  cancel-in-progress: false
jobs:
  review:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: Check runtime and release
        run: |
          node --test scripts/research.test.mjs scripts/site.test.mjs
          node scripts/verify.mjs
          node scripts/research.mjs --verify
      - name: Persist senior review reservations
        env:
          BATCH: ${{ inputs.batch || '1' }}
        run: |
          node scripts/research.mjs --reserve-reviews "$BATCH"
          node scripts/verify.mjs --refresh-manifest
          git config user.name 'WikiREA research'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/state.json release-manifest.json
          if ! git diff --cached --quiet; then
            git commit -m 'review: reserve source-pinned compiler packets'
            git push origin HEAD:main
          fi
      - name: Review compiled research
        env:
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
        run: node scripts/research.mjs --review-packets
      - name: Preserve review outcomes and publish accepted notes
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node scripts/research.mjs --verify
          node scripts/verify.mjs --refresh-manifest
          node scripts/verify.mjs
          git add research release-manifest.json
          if ! git diff --cached --quiet; then
            git commit -m 'review: retain actual senior outcomes and accepted notes'
            git push origin "HEAD:refs/heads/research-receipts/${GITHUB_RUN_ID}"
            git push origin HEAD:main
            gh workflow run pages.yml --ref main
          fi
