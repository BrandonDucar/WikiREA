name: WikiREA research workers
on:
  schedule:
    - cron: '7 0-4,6-10,12-16,18-22 * * *'
  workflow_dispatch:
    inputs:
      batch:
        description: 'Number of distinct roles to reserve (1–10, shared daily cap applies)'
        type: choice
        options: ['1', '2', '10']
        default: '1'
permissions:
  contents: write
  actions: write
concurrency:
  group: wikirea-research
  cancel-in-progress: false
jobs:
  research:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: Check runtime and release
        run: |
          node --test scripts/research.test.mjs scripts/site.test.mjs
          node scripts/verify.mjs
          node scripts/research.mjs --verify
      - name: Persist reservations before inference
        id: reserve
        env:
          BATCH: ${{ inputs.batch || '1' }}
        run: |
          node scripts/research.mjs --reserve "$BATCH"
          node scripts/research.mjs --reserve-reviews "$BATCH"
          node scripts/verify.mjs --refresh-manifest
          git config user.name 'WikiREA research'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/state.json release-manifest.json
          if ! git diff --cached --quiet; then
            git commit -m 'research: reserve bounded source investigations'
            git push origin HEAD:main
          fi
      - name: Research and separate model check
        env:
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
        run: node scripts/research.mjs --work
      - name: Review retained packets after a qualified route change
        if: always() && steps.reserve.outcome == 'success'
        env:
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
        run: node scripts/research.mjs --review-packets
      - name: Retain actual outcomes and rebuild publication
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node scripts/research.mjs --verify
          node scripts/verify.mjs --refresh-manifest
          node scripts/verify.mjs
          git add research release-manifest.json
          if ! git diff --cached --quiet; then
            git commit -m 'research: retain source-bound findings and worker outcomes'
            git push origin HEAD:main
            gh workflow run pages.yml --ref main
          fi
